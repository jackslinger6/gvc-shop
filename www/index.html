<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GVC Shop</title>
<script src="vendor/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Oswald:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0e10; --panel:#1a1c20; --panel2:#22252a;
  --line:#3a3e45; --text:#e9e6e1; --muted:#9aa0a8; --dim:#6c727a;
  --orange:#ff8a2a; --amber:#f5b041; --red:#e5483b; --blue:#2f8ff0; --purple:#9b4dff; --cyan:#22c3e6; --green:#3ad06b; --pink:#e04fa0;
  --pipe:#a374ff; --order:#ff8a2a; --build:#3ad06b;
  --radius:8px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background-color:var(--bg);
  background-image:
    radial-gradient(1200px 500px at 15% -10%, rgba(255,120,40,.10), transparent 60%),
    radial-gradient(900px 500px at 90% 0%, rgba(255,90,30,.07), transparent 60%),
    repeating-linear-gradient(115deg, rgba(255,255,255,.012) 0 2px, transparent 2px 7px),
    linear-gradient(180deg,#121316,#0b0c0e);
  background-attachment:fixed;
  color:var(--text); font-family:Inter,system-ui,sans-serif; font-size:14px; min-height:100vh;
}
header{text-align:center;padding:calc(18px + env(safe-area-inset-top)) 16px 6px}
.title{
  font-family:"Russo One",sans-serif; font-size:clamp(28px,5.4vw,58px); letter-spacing:.04em; line-height:1; margin:0;
  background:linear-gradient(180deg,#f4f1ec 0%,#c9c3ba 42%,#8a8379 52%,#d8d1c7 70%,#a29a8f 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 2px 0 rgba(0,0,0,.8)) drop-shadow(0 0 14px rgba(255,120,40,.35));
}
.sub{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:8px;font-family:Oswald,sans-serif;letter-spacing:.35em;color:#cfc9c0;font-size:clamp(11px,1.6vw,15px)}
.sub:before,.sub:after{content:"";height:2px;width:min(18vw,160px);background:linear-gradient(90deg,transparent,var(--orange),transparent)}
.wrap{max-width:1500px;margin:0 auto;padding:0 16px}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:14px;flex-wrap:wrap}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{font-family:Oswald,sans-serif;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:16px;color:#cfc9c0;background:rgba(0,0,0,.35);border:1px solid var(--line);border-bottom:3px solid var(--line);border-radius:8px 8px 4px 4px;padding:8px 16px;cursor:pointer;display:flex;align-items:center;gap:8px}
.tab .ct{font-family:Inter,sans-serif;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:0}
.tab .at{font-family:Inter,sans-serif;font-size:11px;font-weight:600;letter-spacing:0;background:rgba(229,72,59,.18);color:#ff9b91;border:1px solid rgba(229,72,59,.5);border-radius:999px;padding:0 7px}
.tab.on{color:#fff;border-bottom-color:var(--c);background:rgba(255,255,255,.04)}
.status{color:var(--muted);font-size:12px}
.btn{font:inherit;font-weight:600;font-size:13px;border-radius:var(--radius);border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:8px 12px;cursor:pointer}
.btn:hover{border-color:#5a5f68}
.btn.primary{background:linear-gradient(180deg,#ff9a40,#e8711a);border-color:#ff9a40;color:#1b0f05}
.btn.ghost{background:transparent}
.btn.danger{color:#ffb3ab;border-color:#5c2a26}
.btn.sm{padding:4px 9px;font-size:12px}
.board{display:grid;gap:0;margin:12px 0 0}
.col{border-left:1px solid rgba(255,255,255,.08);min-height:340px;display:flex;flex-direction:column;min-width:0}
.col:last-child{border-right:1px solid rgba(255,255,255,.08)}
.colhead{position:relative;padding:14px 8px 10px;text-align:center;background:rgba(0,0,0,.35);border-bottom:1px solid rgba(255,255,255,.06)}
.colhead:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--c);box-shadow:0 0 12px var(--c)}
.colhead h2{margin:0;font-family:Oswald,sans-serif;font-weight:600;font-size:17px;letter-spacing:.04em;text-transform:uppercase;line-height:1.05;color:#ece8e2;min-height:36px;display:flex;align-items:center;justify-content:center}
.colhead .n{font-size:11px;color:var(--dim);margin-top:3px;min-height:13px}
.cards{padding:10px 8px;display:flex;flex-direction:column;gap:10px;flex:1}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:10px;padding:10px 10px 8px;cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%}
.card:hover{border-color:var(--c)}
.card .nm{font-weight:600;font-size:13.5px;line-height:1.25;display:flex;gap:7px;align-items:flex-start}
.card .nm svg{flex:0 0 auto;margin-top:1px}
.card .tx{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.35}
.flag{display:inline-block;margin-top:7px;margin-right:4px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px}
.flag.you{background:rgba(255,138,42,.15);color:#ffb070;border:1px solid rgba(255,138,42,.45)}
.flag.late{background:rgba(229,72,59,.14);color:#ff9b91;border:1px solid rgba(229,72,59,.45)}
.flag.go{background:rgba(34,195,230,.13);color:#8fe3f5;border:1px solid rgba(34,195,230,.45)}
.flag.count{background:rgba(245,176,65,.14);color:#ffd28a;border:1px solid rgba(245,176,65,.5)}
.flag.bend{background:rgba(224,79,160,.14);color:#ff9fd2;border:1px solid rgba(224,79,160,.5)}
.flag.sample{background:rgba(255,255,255,.06);color:var(--muted);border:1px dashed #555}
.sups{margin-top:7px;display:flex;flex-direction:column;gap:4px}
.sup{display:grid;grid-template-columns:8px 1fr;column-gap:6px;align-items:center;font-size:12px;color:#cfd3d8;min-width:0}
.sup .who{min-width:0;font-weight:500}
.sup .st{grid-column:2;color:var(--muted);font-size:11.5px;line-height:1.25}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.list{margin:26px 0 40px;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:rgba(0,0,0,.3);padding:14px 14px 10px}
.listhead{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.listhead h3{margin:0;font-family:Oswald,sans-serif;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:16px;color:#e4dfd8}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.trk{display:grid;grid-template-columns:minmax(150px,240px) minmax(0,1fr) 150px;gap:8px 12px;align-items:center}
.trk .hdr{font-size:10.5px;color:var(--dim)}
.cells{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:3px}
.cells.lbl div{font-size:10px;color:var(--dim);text-align:center;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell{height:16px;border-radius:3px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07)}
.cell.past{opacity:.38;border-color:transparent}
.cell.now{border-color:#fff;box-shadow:0 0 8px var(--cc)}
.jn{background:none;border:0;color:var(--text);font:inherit;font-size:13px;text-align:left;cursor:pointer;padding:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jn:hover{color:#ffb070}
.where{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;padding:28px 12px;overflow:auto;z-index:10}
.scrim.on{display:flex}
.dlg{background:#17191c;border:1px solid var(--line);border-radius:14px;width:min(1040px,100%);padding:18px 18px 16px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.dlg h3{margin:0;font-family:Oswald,sans-serif;font-weight:600;font-size:20px;letter-spacing:.02em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted);flex:1;min-width:140px}
input,select,textarea{font:inherit;font-size:13.5px;color:var(--text);background:#0f1012;border:1px solid var(--line);border-radius:var(--radius);padding:7px 9px;width:100%}
textarea{min-height:56px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--orange)}
.sec{margin-top:16px;font-family:Oswald,sans-serif;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:#d7d1c8;display:flex;justify-content:space-between;align-items:center}
.supbox{border:1px solid var(--line);border-left:4px solid var(--c,#555);border-radius:10px;padding:10px;margin-top:8px;background:#141518}
.supbox .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.supbox .meta{font-size:12px;color:var(--muted);margin-top:2px}
.log{margin-top:6px;display:flex;flex-direction:column;gap:5px}
.log div{font-size:12.5px;color:#cfd3d8;padding:6px 8px;background:#101113;border-radius:6px;border:1px solid #26292e}
.log small{color:var(--dim);margin-right:6px}
.stagebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#141518}
.stagebar .now{font-weight:600}
.foot{display:flex;justify-content:space-between;gap:8px;margin-top:16px;flex-wrap:wrap}
.err{color:#ff9b91;font-size:12px;min-height:16px;margin-top:6px}
.asg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:8px}
.asm{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:8px 9px;background:#141518;min-width:0}
.asm .an{font-weight:600;font-size:13px}
.asm .am{font-size:11.5px;color:var(--muted);margin:2px 0 6px}
.asm select{padding:5px 7px;font-size:12.5px;margin-top:5px}
.asm .lock{font-size:11.5px;color:var(--muted);margin-top:6px}
.prog{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:7px}
.prog div{height:100%;background:var(--green)}
.pct{font-size:11.5px;color:var(--muted);margin-top:4px}
.lanes{display:grid;grid-template-columns:repeat(5,minmax(170px,1fr));gap:0;margin-top:12px}
.lane .cards .card{cursor:default}
.lane .jl{font-size:11.5px;color:var(--muted);margin-top:2px;background:none;border:0;padding:0;cursor:pointer;text-align:left;font:inherit;font-size:11.5px}
.lane .jl:hover{color:#ffb070}
.lane select{padding:4px 6px;font-size:12px;margin-top:6px}
.undo{display:none}
.undo.on{display:inline-block}
.toast{position:fixed;left:16px;bottom:16px;background:#202328;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;display:none;gap:10px;align-items:center;z-index:20;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:calc(100vw - 32px)}
.toast.on{display:flex}
.toast button{background:none;border:0;color:#ffb070;font:inherit;font-weight:600;cursor:pointer;padding:0}
.atw{overflow-x:auto;margin-top:8px;border:1px solid var(--line);border-radius:10px}
table.at{border-collapse:collapse;width:100%;min-width:760px;font-size:13px}
table.at th{font-family:Oswald,sans-serif;font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:12px;color:#d7d1c8;padding:10px 6px 8px;background:#121315;border-bottom:1px solid var(--line);text-align:center;position:relative}
table.at th.sc:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--c)}
table.at th:first-child,table.at td:first-child{text-align:left;padding-left:12px}
table.at td{border-bottom:1px solid #26292e;padding:6px;text-align:center;vertical-align:middle}
table.at tr:last-child td{border-bottom:0}
table.at tr:hover td{background:rgba(255,255,255,.02)}
.an2{font-weight:600}.am2{font-size:11.5px;color:var(--muted)}
.sb{width:100%;min-width:74px;height:30px;border-radius:7px;border:1px dashed #33373d;background:transparent;color:var(--dim);cursor:pointer;font:inherit;font-size:12px}
.sb:hover{border-color:var(--c);color:var(--text)}
.sb.past{border-style:solid;border-color:transparent;background:var(--c);opacity:.22}
.sb.now{border:1px solid var(--c);background:var(--c);color:#111;font-weight:700;box-shadow:0 0 10px var(--c)}
.waits{font-size:12px;color:var(--muted);border:1px dashed #3a3e45;border-radius:7px;padding:6px}
td select.who{padding:5px 7px;font-size:12.5px;min-width:110px}
.rmb{background:none;border:0;color:var(--dim);cursor:pointer;font-size:16px;padding:2px 6px}
.rmb:hover{color:#ff9b91}
.login{max-width:380px;margin:30px auto;padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.login h2{font-family:Oswald,sans-serif;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:18px;margin:0 0 12px}
.login label{margin-top:10px}
.login .msg{font-size:13px;color:var(--muted);min-height:18px;margin-top:10px}
.login .msg.bad{color:#ff9b91}
.signout{background:none;border:0;color:var(--dim);font:inherit;font-size:12px;cursor:pointer;text-decoration:underline}
.empty{color:var(--dim);font-size:12px;text-align:center;padding:8px 0}
@media (max-width:900px){
  .tabs{display:grid;grid-template-columns:1fr 1fr;width:100%}
  .tab{font-size:14px;padding:8px 10px;justify-content:center}
  .bar{gap:8px}
  .col.emptycol{display:none}
  .dlg{padding:14px 12px}
  .scrim{padding:10px 6px}
  .lanes{grid-template-columns:1fr !important;gap:12px}
  .board{grid-template-columns:1fr !important;gap:12px}
  .col{border:1px solid rgba(255,255,255,.08) !important;border-radius:10px;min-height:0;overflow:hidden}
  .colhead h2{min-height:0}
  .trk{grid-template-columns:minmax(0,1fr)}
  .trk .where{margin-bottom:8px}
  .trk .hdr{display:none}
}
</style>
</head>
<body>
<header>
  <h1 class="title">GORDEYVILLE CUSTOMS</h1>
  <div class="sub">ORDER STATUS</div>
</header>
<div class="wrap">
  <section class="login" id="login" hidden>
    <h2>Sign in</h2>
    <label>Email<input id="lEmail" type="email" autocomplete="username" placeholder="name@example.com"></label>
    <label>Password<input id="lPass" type="password" autocomplete="current-password"></label>
    <div class="row" style="margin-top:14px"><button class="btn primary" type="button" id="lIn">Sign in</button><button class="btn" type="button" id="lUp">Create account</button></div>
    <div class="msg" id="lMsg">Use your work email. First time here? Pick a password and tap Create account, then confirm it from the email.</div>
  </section>
  <div id="app" hidden>
  <div class="bar">
    <div class="tabs" id="tabs" role="tablist"></div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <span class="status" id="status">Loading…</span>
      <button class="btn undo" id="undoBtn" type="button" title="Undo (Ctrl+Z)">↶ Undo</button>
      <button class="btn primary" id="addJob" type="button">+ New job</button>
    </div>
  </div>
  <div class="board" id="board"></div>
  <section class="list">
    <div class="listhead">
      <h3>All jobs</h3>
      <div class="legend"><span><span class="sw" style="background:var(--pipe)"></span>Pipeline</span><span><span class="sw" style="background:var(--order)"></span>Orders</span><span><span class="sw" style="background:var(--build)"></span>Shop floor</span></div>
    </div>
    <div class="trk" id="track"></div>
  </section>
  <div style="text-align:center;margin:-20px 0 30px"><button class="signout" type="button" id="signOut">Sign out</button></div>
  </div>
</div>
<div class="toast" id="toast" role="status"><span id="toastTx"></span><button type="button" id="toastUndo">Undo</button></div>
<div class="scrim" id="scrim" role="dialog" aria-modal="true" aria-labelledby="dlgTitle"><div class="dlg" id="dlg"></div></div>

<script>
const BOARDS=[
 {k:"pipeline",t:"Pipeline",c:"var(--pipe)",stages:[
   {k:"released",t:"Released to Me",c:"var(--pipe)"},
   {k:"drawings",t:"Check Drawings",c:"var(--blue)"},
   {k:"dxfs",t:"Make DXFs",c:"var(--cyan)"}]},
 {k:"ordering",t:"Orders",c:"var(--order)",stages:[
   {k:"prep",t:"Preparing Order",c:"var(--red)"},
   {k:"quote",t:"Quote Requested",c:"var(--orange)"},
   {k:"prod",t:"In Production",c:"var(--purple)"},
   {k:"pickup",t:"Ready to Pick Up",c:"var(--cyan)"},
   {k:"arrived",t:"Arrived - To Count",c:"var(--amber)"},
   {k:"recv",t:"Received",c:"var(--green)"}]},
 {k:"build",t:"Shop floor",c:"var(--build)",stages:[
   {k:"bending",t:"Bending",c:"var(--pink)"},
   {k:"fab",t:"Fabrication",c:"var(--orange)"},
   {k:"paint",t:"Paint",c:"var(--blue)"},
   {k:"assembly",t:"Assembly / Install",c:"var(--purple)"},
   {k:"done",t:"Done",c:"var(--green)"}]}
];
const STAGES=[]; BOARDS.forEach(b=>b.stages.forEach(s=>STAGES.push({...s,board:b.k,bc:b.c,bt:b.t})));
const SIDX=Object.fromEntries(STAGES.map((s,i)=>[s.k,i]));
const ST={
 sent:{t:"Sent - waiting",c:"#8e96a3"}, replied:{t:"Replied",c:"#2f8ff0"}, quote:{t:"Quote in",c:"#ff8a2a"},
 approved:{t:"Approved / PO",c:"#9b4dff"}, production:{t:"In production",c:"#9b4dff"}, ready:{t:"Ready for pickup",c:"#22c3e6"},
 arrived:{t:"Arrived - not counted",c:"#f5b041"}, received:{t:"Received - counted",c:"#3ad06b"}, hold:{t:"On hold",c:"#6c727a"}, declined:{t:"Declined",c:"#4a4f56"}
};
const CREW=["Kyle","Colton","Aaron","Cooper"];
const AST={bend:{t:"Waiting on bending",c:"#e04fa0"},ready:{t:"Ready for fab",c:"#2f8ff0"},prog:{t:"In progress",c:"#ff8a2a"},qc:{t:"Inspection",c:"#9b4dff"},done:{t:"Done",c:"#3ad06b"}};
const FAB_STAGES=["bending","fab","paint","assembly"];
const asmDone=j=>(j.assemblies||[]).filter(a=>a.status==="done").length;
const finalLocked=(j,a)=>a.final&&(j.assemblies||[]).some(x=>!x.final&&x.status!=="done");
const ACTIVE=s=>s.status!=="hold"&&s.status!=="declined";
let db=null, jobs=[], openId=null, cur="ordering";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const days=iso=>iso?Math.floor((Date.now()-new Date(iso).getTime())/86400000):null;
const fmt=iso=>{if(!iso)return"";const d=new Date(iso);return d.toLocaleDateString("en-CA",{month:"short",day:"numeric"})+" "+d.toLocaleTimeString("en-CA",{hour:"numeric",minute:"2-digit"});};
const uid=()=>Math.random().toString(36).slice(2,10);
const first=n=>String(n||"").split(" ")[0];
const stOf=j=>STAGES[SIDX[j.stage]??0];

function flags(j){
  const out=[]; const s=j.stage; const a=(j.suppliers||[]).filter(ACTIVE);
  if(j.sample) out.push(`<span class="flag sample">Sample</span>`);
  if(s==="quote"){
    a.filter(x=>x.status==="quote").forEach(x=>out.push(`<span class="flag you">${esc(first(x.name))} quote waiting on you</span>`));
    a.filter(x=>x.status==="sent"&&days(x.sent)>=2).forEach(x=>out.push(`<span class="flag late">${esc(first(x.name))}: no reply ${days(x.sent)}d</span>`));
  }
  if(s==="pickup") out.push(`<span class="flag go">Pick up${a[0]?" at "+esc(first(a[0].name)):""}</span>`);
  if(s==="arrived") out.push(`<span class="flag count">Count &amp; check</span>`);
  if(s==="bending") out.push(`<span class="flag bend">Needs bending</span>`);
  return out;
}
const needsAttention=j=>!j.sample&&flags(j).length>0;
function supLine(x){
  const st=ST[x.status]||ST.sent; let extra="";
  if(x.status==="sent"&&x.sent){const d=days(x.sent);extra=d<1?" · today":" · "+d+"d";}
  if(x.status==="quote"&&x.quoteNo) extra=" · #"+esc(x.quoteNo);
  return `<div class="sup"><span class="dot" style="background:${st.c}"></span><span class="who">${esc(x.name)}</span><span class="st">${st.t}${extra}</span></div>`;
}

const undoStack=[]; let toastT=null;
function pushUndo(id,prev,label){
  undoStack.push({id,prev:prev?structuredClone(prev):null,label}); if(undoStack.length>50) undoStack.shift();
  $("#undoBtn").classList.add("on"); $("#undoBtn").textContent="↶ Undo"; $("#undoBtn").title="Undo: "+label+" (Ctrl+Z)";
  $("#toastUndo").style.display=""; $("#toastTx").textContent=label; $("#toast").classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>$("#toast").classList.remove("on"),7000);
}
async function undo(){
  const u=undoStack.pop(); if(!u) return;
  try{
    if(!db){ if(u.prev) { const i=jobs.findIndex(x=>x.id===u.id); if(i>=0) jobs[i]={id:u.id,...u.prev}; else jobs.push({id:u.id,...u.prev}); } else jobs=jobs.filter(x=>x.id!==u.id); render(); }
    else if(u.prev) await saveJob(u.id,u.prev); else await deleteJob(u.id);
    $("#toastTx").textContent="Undid: "+u.label; $("#toast").classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>$("#toast").classList.remove("on"),4000);
  }catch(e){ undoStack.push(u); $("#toastTx").textContent="Couldn't undo: "+(e.message||e); $("#toast").classList.add("on"); }
  $("#toastUndo").style.display=undoStack.length?"":"none";
  if(!undoStack.length) $("#undoBtn").classList.remove("on"); else $("#undoBtn").title="Undo: "+undoStack[undoStack.length-1].label+" (Ctrl+Z)";
}

}
function showLogin(msg,bad){ $("#login").hidden=false; $("#app").hidden=true; if(msg){ $("#lMsg").textContent=msg; $("#lMsg").className="msg"+(bad?" bad":""); } }
async function startApp(){
  const { data:key, error } = await sb.rpc("gvc_widget_key");
  if(error){ await sb.auth.signOut(); showLogin("This account isn't on the shop list yet. Ask Kyle to add your email.", true); return; }
  try{ Widget && await Widget.setKey({ key }); }catch(e){}
  $("#login").hidden=true; $("#app").hidden=false;
  db=sb; await loadJobs();
  if(channel) sb.removeChannel(channel);
  channel=sb.channel("gvc_jobs").on("postgres_changes",{event:"*",schema:"public",table:"gvc_jobs"},()=>loadJobs()).subscribe();
}
$("#lIn").onclick=async()=>{
  const email=$("#lEmail").value.trim(), password=$("#lPass").value;
  if(!email||!password){ showLogin("Enter your email and password.", true); return; }
  $("#lMsg").textContent="Signing in…"; $("#lMsg").className="msg";
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ showLogin(error.message==="Email not confirmed"?"Confirm your email first - check your inbox for the link.":error.message, true); return; }
  await startApp();
};
$("#lUp").onclick=async()=>{
  const email=$("#lEmail").value.trim(), password=$("#lPass").value;
  if(!email||password.length<8){ showLogin("Enter your email and a password of at least 8 characters.", true); return; }
  const { data, error } = await sb.auth.signUp({ email, password });
  if(error){ showLogin(error.message, true); return; }
  if(data.session) await startApp(); else showLogin("Check your email and tap the confirm link, then come back and sign in.");
};
$("#signOut").onclick=async()=>{ try{ Widget && await Widget.signOut(); }catch(e){} await sb.auth.signOut(); jobs=[]; db=null; showLogin("Signed out."); };
if(Widget){ Widget.addListener("launch", d=>{ if(d&&d.tab&&VIEWS.includes(d.tab)){ cur=d.tab; render(); } if(d&&d.job){ setTimeout(()=>{ if(jobs.some(x=>x.id===d.job)) openJob(d.job); },400); } }); }
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && db) loadJobs(); });
render();
(async()=>{
  const { data } = await sb.auth.getSession();
  if(data.session) await startApp(); else showLogin();
})();
</script>
</body>
</html>
