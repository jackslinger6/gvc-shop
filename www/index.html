<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GVC Shop</title>
<script>
window.__errs=[];
function __showErr(m){ try{ window.__errs.push(m); var d=document.getElementById("errbar"); if(!d){ d=document.createElement("div"); d.id="errbar"; d.style.cssText="margin:12px 16px;padding:10px 12px;border:1px solid #5c2a26;border-radius:10px;background:#2a1513;color:#ffb3ab;font:13px/1.4 system-ui,sans-serif;white-space:pre-wrap;word-break:break-word"; (document.body||document.documentElement).appendChild(d); } d.textContent="Something went wrong - send Claude a screenshot of this:\n"+window.__errs.slice(-4).join("\n"); }catch(e){} }
window.addEventListener("error",function(e){ __showErr((e.message||"error")+(e.filename?" ("+e.filename.split("/").pop()+":"+e.lineno+")":"")); });
window.addEventListener("unhandledrejection",function(e){ var r=e.reason; __showErr("Promise: "+(r&&(r.message||r.toString())||r)); });
</script>
<script src="vendor/capacitor.js" onerror="__showErr('Could not load vendor/capacitor.js')"></script>
<script src="vendor/supabase.js" onerror="__showErr('Could not load vendor/supabase.js')"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Oswald:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0e10; --panel:#1a1c20; --panel2:#22252a;
  --line:#3a3e45; --text:#e9e6e1; --muted:#9aa0a8; --dim:#6c727a;
  --orange:#ff8a2a; --amber:#f5b041; --red:#e5483b; --blue:#2f8ff0; --purple:#9b4dff; --cyan:#22c3e6; --green:#3ad06b; --pink:#e04fa0;
  --pipe:#a374ff; --order:#ff8a2a; --build:#3ad06b;
  --radius:8px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background-color:var(--bg);
  background-image:
    radial-gradient(1200px 500px at 15% -10%, rgba(255,120,40,.10), transparent 60%),
    radial-gradient(900px 500px at 90% 0%, rgba(255,90,30,.07), transparent 60%),
    repeating-linear-gradient(115deg, rgba(255,255,255,.012) 0 2px, transparent 2px 7px),
    linear-gradient(180deg,#121316,#0b0c0e);
  background-attachment:fixed;
  color:var(--text); font-family:Inter,system-ui,sans-serif; font-size:14px; min-height:100vh;
}
header{text-align:center;padding:calc(18px + env(safe-area-inset-top)) 16px 6px}
.title{
  font-family:"Russo One",sans-serif; font-size:clamp(28px,5.4vw,58px); letter-spacing:.04em; line-height:1; margin:0;
  background:linear-gradient(180deg,#f4f1ec 0%,#c9c3ba 42%,#8a8379 52%,#d8d1c7 70%,#a29a8f 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 2px 0 rgba(0,0,0,.8)) drop-shadow(0 0 14px rgba(255,120,40,.35));
}
.sub{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:8px;font-family:Oswald,sans-serif;letter-spacing:.35em;color:#cfc9c0;font-size:clamp(11px,1.6vw,15px)}
.sub:before,.sub:after{content:"";height:2px;width:min(18vw,160px);background:linear-gradient(90deg,transparent,var(--orange),transparent)}
.wrap{max-width:1500px;margin:0 auto;padding:0 16px}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:14px;flex-wrap:wrap}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{font-family:Oswald,sans-serif;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:16px;color:#cfc9c0;background:rgba(0,0,0,.35);border:1px solid var(--line);border-bottom:3px solid var(--line);border-radius:8px 8px 4px 4px;padding:8px 16px;cursor:pointer;display:flex;align-items:center;gap:8px}
.tab .ct{font-family:Inter,sans-serif;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:0}
.tab .at{font-family:Inter,sans-serif;font-size:11px;font-weight:600;letter-spacing:0;background:rgba(229,72,59,.18);color:#ff9b91;border:1px solid rgba(229,72,59,.5);border-radius:999px;padding:0 7px}
.tab.on{color:#fff;border-bottom-color:var(--c);background:rgba(255,255,255,.04)}
.status{color:var(--muted);font-size:12px}
.btn{font:inherit;font-weight:600;font-size:13px;border-radius:var(--radius);border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:8px 12px;cursor:pointer}
.btn:hover{border-color:#5a5f68}
.btn.primary{background:linear-gradient(180deg,#ff9a40,#e8711a);border-color:#ff9a40;color:#1b0f05}
.btn.ghost{background:transparent}
.btn.danger{color:#ffb3ab;border-color:#5c2a26}
.btn.sm{padding:4px 9px;font-size:12px}
.board{display:grid;gap:0;margin:12px 0 0}
.col{border-left:1px solid rgba(255,255,255,.08);min-height:340px;display:flex;flex-direction:column;min-width:0}
.col:last-child{border-right:1px solid rgba(255,255,255,.08)}
.colhead{position:relative;padding:14px 8px 10px;text-align:center;background:rgba(0,0,0,.35);border-bottom:1px solid rgba(255,255,255,.06)}
.colhead:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--c);box-shadow:0 0 12px var(--c)}
.colhead h2{margin:0;font-family:Oswald,sans-serif;font-weight:600;font-size:17px;letter-spacing:.04em;text-transform:uppercase;line-height:1.05;color:#ece8e2;min-height:36px;display:flex;align-items:center;justify-content:center}
.colhead .none{display:none;font-size:12px;color:var(--dim)}
.colhead .n{font-size:11px;color:var(--dim);margin-top:3px;min-height:13px}
.cards{padding:10px 8px;display:flex;flex-direction:column;gap:10px;flex:1}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:10px;padding:10px 10px 8px;cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%}
.card:hover{border-color:var(--c)}
.card .nm{font-weight:600;font-size:13.5px;line-height:1.25;display:flex;gap:7px;align-items:flex-start}
.card .nm svg{flex:0 0 auto;margin-top:1px}
.card .tx{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.35}
.flag{display:inline-block;margin-top:7px;margin-right:4px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px}
.flag.you{background:rgba(255,138,42,.15);color:#ffb070;border:1px solid rgba(255,138,42,.45)}
.flag.late{background:rgba(229,72,59,.14);color:#ff9b91;border:1px solid rgba(229,72,59,.45)}
.flag.go{background:rgba(34,195,230,.13);color:#8fe3f5;border:1px solid rgba(34,195,230,.45)}
.flag.count{background:rgba(245,176,65,.14);color:#ffd28a;border:1px solid rgba(245,176,65,.5)}
.flag.bend{background:rgba(224,79,160,.14);color:#ff9fd2;border:1px solid rgba(224,79,160,.5)}
.flag.sample{background:rgba(255,255,255,.06);color:var(--muted);border:1px dashed #555}
.sups{margin-top:7px;display:flex;flex-direction:column;gap:4px}
.sup{display:grid;grid-template-columns:8px 1fr;column-gap:6px;align-items:center;font-size:12px;color:#cfd3d8;min-width:0}
.sup .who{min-width:0;font-weight:500}
.sup .st{grid-column:2;color:var(--muted);font-size:11.5px;line-height:1.25}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.list{margin:26px 0 40px;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:rgba(0,0,0,.3);padding:14px 14px 10px}
.listhead{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.listhead h3{margin:0;font-family:Oswald,sans-serif;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:16px;color:#e4dfd8}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.trk{display:grid;grid-template-columns:minmax(150px,240px) minmax(0,1fr) 150px;gap:8px 12px;align-items:center}
.trk .hdr{font-size:10.5px;color:var(--dim)}
.cells{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:3px}
.cells.lbl div{font-size:10px;color:var(--dim);text-align:center;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell{height:16px;border-radius:3px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07)}
.cell.past{opacity:.38;border-color:transparent}
.cell.now{border-color:#fff;box-shadow:0 0 8px var(--cc)}
.jn{background:none;border:0;color:var(--text);font:inherit;font-size:13px;text-align:left;cursor:pointer;padding:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jn:hover{color:#ffb070}
.where{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;padding:28px 12px;overflow:auto;z-index:10}
.scrim.on{display:flex}
.dlg{background:#17191c;border:1px solid var(--line);border-radius:14px;width:min(1040px,100%);padding:18px 18px 16px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.dlg h3{margin:0;font-family:Oswald,sans-serif;font-weight:600;font-size:20px;letter-spacing:.02em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted);flex:1;min-width:140px}
input,select,textarea{font:inherit;font-size:13.5px;color:var(--text);background:#0f1012;border:1px solid var(--line);border-radius:var(--radius);padding:7px 9px;width:100%}
textarea{min-height:56px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--orange)}
.sec{margin-top:16px;font-family:Oswald,sans-serif;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:#d7d1c8;display:flex;justify-content:space-between;align-items:center}
.supbox{border:1px solid var(--line);border-left:4px solid var(--c,#555);border-radius:10px;padding:10px;margin-top:8px;background:#141518}
.supbox .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.supbox .meta{font-size:12px;color:var(--muted);margin-top:2px}
.log{margin-top:6px;display:flex;flex-direction:column;gap:5px}
.log div{font-size:12.5px;color:#cfd3d8;padding:6px 8px;background:#101113;border-radius:6px;border:1px solid #26292e}
.log small{color:var(--dim);margin-right:6px}
.stagebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#141518}
.stagebar .now{font-weight:600}
.foot{display:flex;justify-content:space-between;gap:8px;margin-top:16px;flex-wrap:wrap}
.err{color:#ff9b91;font-size:12px;min-height:16px;margin-top:6px}
.asg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:8px}
.asm{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:8px 9px;background:#141518;min-width:0}
.asm .an{font-weight:600;font-size:13px}
.asm .am{font-size:11.5px;color:var(--muted);margin:2px 0 6px}
.asm select{padding:5px 7px;font-size:12.5px;margin-top:5px}
.asm .lock{font-size:11.5px;color:var(--muted);margin-top:6px}
.prog{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:7px}
.prog div{height:100%;background:var(--green)}
.pct{font-size:11.5px;color:var(--muted);margin-top:4px}
.lanes{display:grid;grid-template-columns:repeat(5,minmax(170px,1fr));gap:0;margin-top:12px}
.lane .cards .card{cursor:default}
.lane .jl{font-size:11.5px;color:var(--muted);margin-top:2px;background:none;border:0;padding:0;cursor:pointer;text-align:left;font:inherit;font-size:11.5px}
.lane .jl:hover{color:#ffb070}
.lane select{padding:4px 6px;font-size:12px;margin-top:6px}
.undo{display:none}
.undo.on{display:inline-block}
.toast{position:fixed;left:16px;bottom:16px;background:#202328;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;display:none;gap:10px;align-items:center;z-index:20;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:calc(100vw - 32px)}
.toast.on{display:flex}
.toast button{background:none;border:0;color:#ffb070;font:inherit;font-weight:600;cursor:pointer;padding:0}
.atw{overflow-x:auto;margin-top:8px;border:1px solid var(--line);border-radius:10px}
table.at{border-collapse:collapse;width:100%;min-width:760px;font-size:13px}
table.at th{font-family:Oswald,sans-serif;font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:12px;color:#d7d1c8;padding:10px 6px 8px;background:#121315;border-bottom:1px solid var(--line);text-align:center;position:relative}
table.at th.sc:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--c)}
table.at th:first-child,table.at td:first-child{text-align:left;padding-left:12px}
table.at td{border-bottom:1px solid #26292e;padding:6px;text-align:center;vertical-align:middle}
table.at tr:last-child td{border-bottom:0}
table.at tr:hover td{background:rgba(255,255,255,.02)}
.an2{font-weight:600}.am2{font-size:11.5px;color:var(--muted)}
.sb{width:100%;min-width:74px;height:30px;border-radius:7px;border:1px dashed #33373d;background:transparent;color:var(--dim);cursor:pointer;font:inherit;font-size:12px}
.sb:hover{border-color:var(--c);color:var(--text)}
.sb.past{border-style:solid;border-color:transparent;background:var(--c);opacity:.22}
.sb.now{border:1px solid var(--c);background:var(--c);color:#111;font-weight:700;box-shadow:0 0 10px var(--c)}
.waits{font-size:12px;color:var(--muted);border:1px dashed #3a3e45;border-radius:7px;padding:6px}
td select.who{padding:5px 7px;font-size:12.5px;min-width:110px}
.rmb{background:none;border:0;color:var(--dim);cursor:pointer;font-size:16px;padding:2px 6px}
.rmb:hover{color:#ff9b91}
.login{max-width:380px;margin:30px auto;padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.login h2{font-family:Oswald,sans-serif;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:18px;margin:0 0 12px}
.login label{margin-top:10px}
.login .msg{font-size:13px;color:var(--muted);min-height:18px;margin-top:10px}
.login .msg.bad{color:#ff9b91}
.signout{background:none;border:0;color:var(--dim);font:inherit;font-size:12px;cursor:pointer;text-decoration:underline}
.empty{color:var(--dim);font-size:12px;text-align:center;padding:8px 0}
/* ---- chat ---- */
.chatfab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:9;border-radius:999px;padding:12px 18px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.chatp{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:min(420px,calc(100vw - 24px));height:min(620px,calc(100vh - 60px));z-index:11;display:none;flex-direction:column;background:#141619;border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.7);overflow:hidden}
.chatp.on{display:flex}
.chatp .ch{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);font-family:Oswald,sans-serif;letter-spacing:.06em;text-transform:uppercase;font-size:15px}
.chatp .ch .sp{flex:1}
.chatp .ch button{background:none;border:0;color:var(--muted);font:inherit;font-size:12px;cursor:pointer;text-transform:none;letter-spacing:0;font-family:Inter,sans-serif}
.chatp .cm{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.chatp .b{max-width:88%;padding:8px 11px;border-radius:12px;font-size:14px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
.chatp .b.u{align-self:flex-end;background:#3a2a1a;border:1px solid #6b4a26}
.chatp .b.a{align-self:flex-start;background:var(--panel2);border:1px solid var(--line)}
.chatp .act{align-self:flex-start;font-size:12px;color:#8fe3a8;background:rgba(58,208,107,.08);border:1px solid rgba(58,208,107,.3);border-radius:8px;padding:4px 8px}
.chatp .ci{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.chatp .ci textarea{flex:1;resize:none;height:42px;max-height:120px}
.chatp .hint{font-size:12px;color:var(--dim);padding:4px 2px}
@media (max-width:600px){ .chatp{right:0;left:0;bottom:0;width:100%;height:85vh;border-radius:14px 14px 0 0} }
/* ---- To do ---- */
.todo{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;margin-top:12px}
.tbox{border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.28);padding:12px 12px 8px}
.tbox h3{font-family:Oswald,sans-serif;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.tbox h3 .n{font-size:12px;color:var(--muted);font-family:Inter,sans-serif;letter-spacing:0}
.ti{display:flex;gap:10px;align-items:flex-start;padding:9px 4px;border-top:1px solid rgba(255,255,255,.06)}
.ti:first-of-type{border-top:0}
.ti .ck{flex:none;width:22px;height:22px;border-radius:6px;border:1.5px solid #5a5f68;background:transparent;cursor:pointer;margin-top:1px;color:transparent;font-size:14px;line-height:18px;padding:0}
.ti .ck:hover{border-color:var(--green);color:var(--green)}
.ti .bar{flex:none;width:3px;align-self:stretch;border-radius:2px;background:var(--c,#6c727a)}
.ti .body{flex:1;min-width:0}
.ti .tt{font-size:14px;line-height:1.35}
.ti .meta{font-size:11.5px;color:var(--dim);margin-top:2px}
.ti .go{background:none;border:0;color:var(--muted);font:inherit;font-size:11.5px;padding:0;cursor:pointer;text-decoration:underline}
.addtodo{display:flex;gap:8px;margin:2px 0 8px}
.addtodo input{flex:1}
.sg{border:1px solid var(--line);border-radius:10px;background:linear-gradient(180deg,var(--panel2),var(--panel));padding:10px 11px;margin-bottom:10px}
.sg .hd{font-size:11.5px;color:var(--dim);display:flex;gap:6px;align-items:center}
.sg .sm{font-weight:600;font-size:14px;margin:4px 0 6px;line-height:1.35}
.sg ul{margin:0 0 8px;padding-left:18px;font-size:13px;color:var(--muted)}
.sg details{font-size:12px;color:var(--dim);margin-bottom:8px}
.sg pre{white-space:pre-wrap;font:inherit;font-size:12px;color:var(--muted);max-height:180px;overflow:auto;margin:6px 0 0;background:rgba(0,0,0,.3);padding:8px;border-radius:6px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.btn.rec{border-color:#7a2a24;color:#ffb3ab}
.btn.rec.on{background:#c0392b;color:#fff;border-color:#e5483b;animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(229,72,59,.18)}}
.paste textarea{width:100%;min-height:70px;resize:vertical;margin-bottom:6px}
.tnote{font-size:12px;color:var(--dim);margin:2px 0 10px}
.clist label{display:flex;gap:10px;align-items:center;padding:8px 2px;border-top:1px solid rgba(255,255,255,.06);font-size:14px}
.clist label span{color:var(--dim);font-size:12px}
@media (max-width:900px){
  .todo{grid-template-columns:1fr}
  .tab[data-b=todo]{grid-column:1/-1}
  .tabs{display:grid;grid-template-columns:1fr 1fr;width:100%}
  .tab{font-size:14px;padding:8px 10px;justify-content:center}
  .bar{gap:8px}
  .col.emptycol{border-radius:8px !important}
  .col.emptycol .colhead{padding:7px 10px;text-align:left;display:flex;align-items:center;gap:8px}
  .col.emptycol .colhead:before{height:100%;width:3px;right:auto;bottom:0;box-shadow:none;opacity:.7}
  .col.emptycol .colhead h2{font-size:13px;min-height:0;justify-content:flex-start;color:var(--dim);padding-left:6px}
  .col.emptycol .colhead .n{display:none}
  .col.emptycol .colhead .none{display:inline}
  .col.emptycol .cards{display:none}
  .dlg{padding:14px 12px}
  .scrim{padding:10px 6px}
  .lanes{grid-template-columns:1fr !important;gap:12px}
  .board{grid-template-columns:1fr !important;gap:12px}
  .col{border:1px solid rgba(255,255,255,.08) !important;border-radius:10px;min-height:0;overflow:hidden}
  .colhead h2{min-height:0}
  .trk{grid-template-columns:minmax(0,1fr)}
  .trk .where{margin-bottom:8px}
  .trk .hdr{display:none}
}
</style>
</head>
<body>
<header>
  <h1 class="title">GORDEYVILLE CUSTOMS</h1>
  <div class="sub">ORDER STATUS</div>
</header>
<div class="wrap">
  <section class="login" id="login" hidden>
    <h2>Sign in</h2>
    <label>Email<input id="lEmail" type="email" autocomplete="username" placeholder="name@example.com"></label>
    <label>Password<input id="lPass" type="password" autocomplete="current-password"></label>
    <div class="row" style="margin-top:14px"><button class="btn primary" type="button" id="lIn">Sign in</button><button class="btn" type="button" id="lUp">Create account</button></div>
    <div class="row" style="margin-top:8px"><button class="btn" type="button" id="lForgot" style="background:none;border:none;padding:4px 0;text-decoration:underline;color:var(--dim)">Forgot password?</button></div>
    <div id="lNew" hidden style="margin-top:12px"><label>New password</label><input type="password" id="lNewPass" autocomplete="new-password"><div class="row" style="margin-top:10px"><button class="btn primary" type="button" id="lSetPass">Save new password</button></div></div>
    <div class="msg" id="lMsg">Use your work email. First time here? Pick a password and tap Create account, then confirm it from the email.</div>
  </section>
  <div id="app" hidden>
  <div class="bar">
    <div class="tabs" id="tabs" role="tablist"></div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <span class="status" id="status">Loading…</span>
      <button class="btn undo" id="undoBtn" type="button" title="Undo (Ctrl+Z)">↶ Undo</button>
      <button class="btn primary" id="addJob" type="button">+ New job</button>
    </div>
  </div>
  <div class="board" id="board"></div>
  <section class="list">
    <div class="listhead">
      <h3>All jobs</h3>
      <div class="legend"><span><span class="sw" style="background:var(--pipe)"></span>Pipeline</span><span><span class="sw" style="background:var(--order)"></span>Orders</span><span><span class="sw" style="background:var(--build)"></span>Shop floor</span></div>
    </div>
    <div class="trk" id="track"></div>
  </section>
  <div style="text-align:center;margin:-20px 0 30px"><button class="signout" type="button" id="signOut">Sign out</button></div>
  </div>
</div>
<button class="btn primary chatfab" type="button" id="chatFab" hidden>💬 Ask Claude</button>
<section class="chatp" id="chatP" aria-label="Ask Claude"><div class="ch">Ask Claude<span class="sp"></span><button type="button" id="chatClear">Clear</button><button type="button" id="chatX" style="font-size:18px">✕</button></div>
<div class="cm" id="chatM"></div>
<div class="ci"><textarea id="chatIn" placeholder="Ask about jobs, plan the day, add a to-do…" aria-label="Message"></textarea><button class="btn primary" type="button" id="chatGo">Send</button></div></section>
<div class="toast" id="toast" role="status"><span id="toastTx"></span><button type="button" id="toastUndo">Undo</button></div>
<div class="scrim" id="scrim" role="dialog" aria-modal="true" aria-labelledby="dlgTitle"><div class="dlg" id="dlg"></div></div>

<script>
const BOARDS=[
 {k:"pipeline",t:"Pipeline",c:"var(--pipe)",stages:[
   {k:"released",t:"Released to Me",c:"var(--pipe)"},
   {k:"drawings",t:"Check Drawings",c:"var(--blue)"},
   {k:"dxfs",t:"Make DXFs",c:"var(--cyan)"}]},
 {k:"ordering",t:"Orders",c:"var(--order)",stages:[
   {k:"prep",t:"Preparing Order",c:"var(--red)"},
   {k:"quote",t:"Quote Requested",c:"var(--orange)"},
   {k:"prod",t:"In Production",c:"var(--purple)"},
   {k:"pickup",t:"Ready to Pick Up",c:"var(--cyan)"},
   {k:"arrived",t:"Arrived - To Count",c:"var(--amber)"},
   {k:"recv",t:"Received",c:"var(--green)"}]},
 {k:"build",t:"Shop floor",c:"var(--build)",stages:[
   {k:"bending",t:"Bending",c:"var(--pink)"},
   {k:"fab",t:"Fabrication",c:"var(--orange)"},
   {k:"paint",t:"Paint",c:"var(--blue)"},
   {k:"assembly",t:"Assembly / Install",c:"var(--purple)"},
   {k:"done",t:"Done",c:"var(--green)"}]}
];
const STAGES=[]; BOARDS.forEach(b=>b.stages.forEach(s=>STAGES.push({...s,board:b.k,bc:b.c,bt:b.t})));
const SIDX=Object.fromEntries(STAGES.map((s,i)=>[s.k,i]));
const ST={
 sent:{t:"Sent - waiting",c:"#8e96a3"}, replied:{t:"Replied",c:"#2f8ff0"}, quote:{t:"Quote in",c:"#ff8a2a"},
 approved:{t:"Approved / PO",c:"#9b4dff"}, production:{t:"In production",c:"#9b4dff"}, ready:{t:"Ready for pickup",c:"#22c3e6"},
 arrived:{t:"Arrived - not counted",c:"#f5b041"}, received:{t:"Received - counted",c:"#3ad06b"}, hold:{t:"On hold",c:"#6c727a"}, declined:{t:"Declined",c:"#4a4f56"}
};
const CREW=["Kyle","Colton","Aaron","Cooper"];
const AST={bend:{t:"Waiting on bending",c:"#e04fa0"},ready:{t:"Ready for fab",c:"#2f8ff0"},prog:{t:"In progress",c:"#ff8a2a"},qc:{t:"Inspection",c:"#9b4dff"},done:{t:"Done",c:"#3ad06b"}};
const FAB_STAGES=["bending","fab","paint","assembly"];
const asmDone=j=>(j.assemblies||[]).filter(a=>a.status==="done").length;
const finalLocked=(j,a)=>a.final&&(j.assemblies||[]).some(x=>!x.final&&x.status!=="done");
const ACTIVE=s=>s.status!=="hold"&&s.status!=="declined";
let db=null, jobs=[], todos=[], suggs=[], openId=null, cur="todo";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const days=iso=>iso?Math.floor((Date.now()-new Date(iso).getTime())/86400000):null;
const fmt=iso=>{if(!iso)return"";const d=new Date(iso);return d.toLocaleDateString("en-CA",{month:"short",day:"numeric"})+" "+d.toLocaleTimeString("en-CA",{hour:"numeric",minute:"2-digit"});};
const uid=()=>Math.random().toString(36).slice(2,10);
const first=n=>String(n||"").split(" ")[0];
const stOf=j=>STAGES[SIDX[j.stage]??0];

function flags(j){
  const out=[]; const s=j.stage; const a=(j.suppliers||[]).filter(ACTIVE);
  if(j.sample) out.push(`<span class="flag sample">Sample</span>`);
  if(s==="quote"){
    a.filter(x=>x.status==="quote").forEach(x=>out.push(`<span class="flag you">${esc(first(x.name))} quote waiting on you</span>`));
    a.filter(x=>x.status==="sent"&&days(x.sent)>=2).forEach(x=>out.push(`<span class="flag late">${esc(first(x.name))}: no reply ${days(x.sent)}d</span>`));
  }
  if(s==="pickup") out.push(`<span class="flag go">Pick up${a[0]?" at "+esc(first(a[0].name)):""}</span>`);
  if(s==="arrived") out.push(`<span class="flag count">Count &amp; check</span>`);
  if(s==="bending") out.push(`<span class="flag bend">Needs bending</span>`);
  return out;
}
const needsAttention=j=>!j.sample&&flags(j).length>0;
function supLine(x){
  const st=ST[x.status]||ST.sent; let extra="";
  if(x.status==="sent"&&x.sent){const d=days(x.sent);extra=d<1?" · today":" · "+d+"d";}
  if(x.status==="quote"&&x.quoteNo) extra=" · #"+esc(x.quoteNo);
  return `<div class="sup"><span class="dot" style="background:${st.c}"></span><span class="who">${esc(x.name)}</span><span class="st">${st.t}${extra}</span></div>`;
}
const folder=`<svg width="16" height="14" viewBox="0 0 16 14" aria-hidden="true"><path d="M1 2.2C1 1.5 1.5 1 2.2 1h3.6l1.4 1.6h6.6c.7 0 1.2.5 1.2 1.2v8c0 .7-.5 1.2-1.2 1.2H2.2C1.5 13 1 12.5 1 11.8z" fill="#f2b33d" stroke="#b07a1a" stroke-width=".8"/></svg>`;

function render(){
  const crewAsm=crewItems();
  const tdCount=autoTodos().length+todos.filter(t=>!t.done_at&&t.source!=="auto").length, sgNew=suggs.filter(x=>x.status==="new").length;
  $("#tabs").innerHTML=`<button class="tab ${cur==="todo"?"on":""}" style="--c:#ffd28a" role="tab" aria-selected="${cur==="todo"}" data-b="todo">To do<span class="ct">${tdCount}</span>${sgNew?`<span class="at">${sgNew} to review</span>`:""}</button>`+BOARDS.map(b=>{
    const js=jobs.filter(j=>stOf(j).board===b.k); const at=js.filter(needsAttention).length;
    return `<button class="tab ${cur===b.k?"on":""}" style="--c:${b.c}" role="tab" aria-selected="${cur===b.k}" data-b="${b.k}">${b.t}<span class="ct">${js.length}</span>${at?`<span class="at">${at}</span>`:""}</button>`;
  }).join("")+`<button class="tab ${cur==="crew"?"on":""}" style="--c:#e9e6e1" role="tab" aria-selected="${cur==="crew"}" data-b="crew">Crew<span class="ct">${crewAsm.filter(x=>x.a.status!=="done").length}</span>${crewAsm.filter(x=>!x.a.who&&x.a.status!=="done"&&!finalLocked(x.j,x.a)).length?`<span class="at">${crewAsm.filter(x=>!x.a.who&&x.a.status!=="done"&&!finalLocked(x.j,x.a)).length} unassigned</span>`:""}</button>`;
  $("#tabs").querySelectorAll(".tab").forEach(t=>t.onclick=()=>{cur=t.dataset.b;try{history.replaceState(null,"","#"+cur)}catch(e){}render();});
  if(cur==="todo"){ renderTodo(); } else if(cur==="crew"){ renderCrew(crewAsm); } else {
  const B=BOARDS.find(b=>b.k===cur);
  $("#board").className="board";
  $("#board").style.gridTemplateColumns=`repeat(${B.stages.length},minmax(150px,1fr))`;
  $("#board").innerHTML=B.stages.map(s=>{
    const list=jobs.filter(j=>j.stage===s.k).sort((x,y)=>(x.order||0)-(y.order||0));
    return `<section class="col ${list.length?"":"emptycol"}" style="--c:${s.c}"><div class="colhead"><h2>${s.t}</h2><span class="none">none</span><div class="n">${list.length||""}</div></div>
      <div class="cards">${list.map(j=>`<button class="card" type="button" style="--c:${s.c}" data-id="${esc(j.id)}">
        <div class="nm">${folder}<span>${esc(j.name)}</span></div>
        ${j.summary?`<div class="tx">${esc(j.summary)}</div>`:""}
        ${B.k==="ordering"&&(j.suppliers||[]).length?`<div class="sups">${j.suppliers.map(supLine).join("")}</div>`:""}
        ${(j.assemblies||[]).length?`<div class="prog"><div style="width:${Math.round(asmDone(j)/j.assemblies.length*100)}%"></div></div><div class="pct">${asmDone(j)} of ${j.assemblies.length} assemblies done</div>`:""}
        ${flags(j).join("")}</button>`).join("")}</div></section>`;
  }).join("");
  $("#board").querySelectorAll(".card").forEach(el=>el.onclick=()=>openJob(el.dataset.id));
  }
  const sorted=jobs.slice().sort((a,b)=>(SIDX[a.stage]??0)-(SIDX[b.stage]??0)||(a.order||0)-(b.order||0));
  $("#track").style.setProperty("--n",STAGES.length);
  $("#track").innerHTML=`<div class="hdr"></div><div class="cells lbl" style="--n:${STAGES.length}">${STAGES.map(s=>`<div title="${s.bt}: ${s.t}">${s.t.replace(" - To Count","").replace("Ready to Pick Up","Pick up").replace("Preparing Order","Preparing").replace("Quote Requested","Quote").replace("In Production","In prod.").replace("Released to Me","Released").replace("Check Drawings","Drawings").replace("Assembly / Install","Assembly")}</div>`).join("")}</div><div class="hdr"></div>`+
   sorted.map(j=>{const i=SIDX[j.stage]??0;const s=STAGES[i];
    return `<button class="jn" type="button" data-id="${esc(j.id)}" title="${esc(j.name)}">${esc(j.name)}${j.sample?' <span style="color:var(--dim)">(sample)</span>':""}</button>
     <div class="cells" style="--n:${STAGES.length}">${STAGES.map((x,xi)=>`<div class="cell ${xi<i?"past":xi===i?"now":""}" title="${x.bt}: ${x.t}" style="${xi<=i?`background:${x.bc};--cc:${x.bc}`:""}"></div>`).join("")}</div>
     <div class="where">${s.bt} · ${s.t}</div>`;}).join("");
  $("#track").querySelectorAll(".jn").forEach(el=>el.onclick=()=>openJob(el.dataset.id));
  const at=jobs.filter(needsAttention).length;
  $("#status").textContent=jobs.length?`${jobs.length} jobs · ${at} need attention`:"No jobs yet. Add one with + New job.";
  if(openId) drawDlg();
}

function crewItems(){
  const out=[]; jobs.filter(j=>FAB_STAGES.includes(j.stage)).forEach(j=>(j.assemblies||[]).forEach((a,i)=>out.push({j,a,i}))); return out;
}
function asmSel(j,i,a,kind){
  if(kind==="who") return `<select data-aj="${esc(j.id)}" data-ai="${i}" data-ak="who" aria-label="Assign ${esc(a.name)}"><option value="">Unassigned</option>${CREW.map(c=>`<option ${a.who===c?"selected":""}>${c}</option>`).join("")}</select>`;
  if(finalLocked(j,a)) return `<div class="lock">Waits on the other assemblies</div>`;
  return `<select data-aj="${esc(j.id)}" data-ai="${i}" data-ak="status" aria-label="Status of ${esc(a.name)}">${Object.entries(AST).map(([k,v])=>`<option value="${k}" ${a.status===k?"selected":""}>${v.t}</option>`).join("")}</select>`;
}
function wireAsm(root){
  root.querySelectorAll("[data-ak]").forEach(el=>el.onchange=()=>setAsm(el.dataset.aj,+el.dataset.ai,el.dataset.ak,el.value));
}
async function setAsm(jid,i,k,v){
  const j=structuredClone(jobs.find(x=>x.id===jid)); const a=j.assemblies[i]; const old=a[k]; a[k]=v;
  const label=k==="who"?(v?`Assigned ${a.name} to ${v}`:`Unassigned ${a.name}`):`${a.name}: ${AST[v].t}`;
  j.log=[...(j.log||[]),{at:new Date().toISOString(),text:label}];
  await put(j,label);
}
function renderCrew(items){
  $("#board").className="lanes"; $("#board").style.gridTemplateColumns="";
  const live=items.filter(x=>x.a.status!=="done");
  $("#board").innerHTML=[...CREW,""].map(c=>{
    const mine=live.filter(x=>(x.a.who||"")===c&&!(c===""&&finalLocked(x.j,x.a)));
    return `<section class="col lane" style="--c:${c?"var(--orange)":"#6c727a"}"><div class="colhead"><h2>${c||"Unassigned"}</h2><div class="n">${mine.length||""}</div></div>
     <div class="cards">${mine.map(x=>{const st=AST[x.a.status]||AST.ready;return `<div class="card" style="--c:${st.c}">
       <div class="nm"><span class="dot" style="background:${st.c};margin-top:5px"></span><span>${esc(x.a.name)}</span></div>
       <button class="jl" type="button" data-open="${esc(x.j.id)}">${esc(x.j.name)}</button>
       ${asmSel(x.j,x.i,x.a,"status")}${asmSel(x.j,x.i,x.a,"who")}</div>`;}).join("")||`<div class="empty">${c?"Nothing assigned":"All assigned"}</div>`}</div></section>`;
  }).join("");
  $("#board").querySelectorAll("[data-open]").forEach(el=>el.onclick=()=>openJob(el.dataset.open));
  wireAsm($("#board"));
}
/* ---------- undo ---------- */
const undoStack=[]; let toastT=null;
function pushUndo(id,prev,label){
  undoStack.push({id,prev:prev?structuredClone(prev):null,label}); if(undoStack.length>50) undoStack.shift();
  $("#undoBtn").classList.add("on"); $("#undoBtn").textContent="↶ Undo"; $("#undoBtn").title="Undo: "+label+" (Ctrl+Z)";
  $("#toastUndo").style.display=""; $("#toastTx").textContent=label; $("#toast").classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>$("#toast").classList.remove("on"),7000);
}
async function undo(){
  const u=undoStack.pop(); if(!u) return;
  try{
    if(!db){ if(u.prev) { const i=jobs.findIndex(x=>x.id===u.id); if(i>=0) jobs[i]={id:u.id,...u.prev}; else jobs.push({id:u.id,...u.prev}); } else jobs=jobs.filter(x=>x.id!==u.id); render(); }
    else if(u.prev) await saveJob(u.id,u.prev); else await deleteJob(u.id);
    $("#toastTx").textContent="Undid: "+u.label; $("#toast").classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>$("#toast").classList.remove("on"),4000);
  }catch(e){ undoStack.push(u); $("#toastTx").textContent="Couldn't undo: "+(e.message||e); $("#toast").classList.add("on"); }
  $("#toastUndo").style.display=undoStack.length?"":"none";
  if(!undoStack.length) $("#undoBtn").classList.remove("on"); else $("#undoBtn").title="Undo: "+undoStack[undoStack.length-1].label+" (Ctrl+Z)";
}
$("#undoBtn").onclick=undo; $("#toastUndo").onclick=undo;
document.addEventListener("keydown",e=>{ if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ e.preventDefault(); undo(); }});
const raw=id=>{const j=jobs.find(x=>x.id===id); if(!j) return null; const {id:_,...d}=j; return d;};
function job(){return jobs.find(j=>j.id===openId);}
function openJob(id){openId=id;drawDlg();$("#scrim").classList.add("on");}
function closeDlg(){openId=null;$("#scrim").classList.remove("on");}
$("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")closeDlg();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDlg();});

function drawDlg(){
  const j=job(); if(!j){closeDlg();return;}
  const i=SIDX[j.stage]??0, s=STAGES[i];
  const stOpts=x=>Object.entries(ST).map(([k,v])=>`<option value="${k}" ${x.status===k?"selected":""}>${v.t}</option>`).join("");
  const stageOpts=BOARDS.map(b=>`<optgroup label="${b.t}">${b.stages.map(x=>`<option value="${x.k}" ${j.stage===x.k?"selected":""}>${x.t}</option>`).join("")}</optgroup>`).join("");
  $("#dlg").innerHTML=`
   <div class="row" style="justify-content:space-between;align-items:center"><h3 id="dlgTitle">${esc(j.name)}</h3><button class="btn ghost" type="button" id="xBtn">Close</button></div>
   <div class="stagebar"><span style="color:var(--muted)">Stage:</span><span class="now">${s.bt} · ${s.t}</span><span style="flex:1"></span>
     <button class="btn sm" type="button" id="back" ${i===0?"disabled":""}>← Back</button>
     <button class="btn sm primary" type="button" id="next" ${i===STAGES.length-1?"disabled":""}>Next: ${i<STAGES.length-1?STAGES[i+1].t:"-"} →</button></div>
   <div class="row" style="margin-top:10px">
     <label>Job name<input id="fName" value="${esc(j.name)}"></label>
     <label>Desktop folder<input id="fFolder" value="${esc(j.folder||"")}" placeholder="Folder name on the desktop"></label>
     <label>Stage<select id="fStage">${stageOpts}</select></label>
   </div>
   <label style="margin-top:8px">Card note<input id="fSum" value="${esc(j.summary||"")}" placeholder="One line shown on the card"></label>
   ${(FAB_STAGES.includes(j.stage)||(j.assemblies||[]).length)?`<div class="sec"><span>Assemblies${(j.assemblies||[]).length?` · ${asmDone(j)} of ${j.assemblies.length} done`:""}</span><button class="btn sm" type="button" id="addAsm">+ Add assembly</button></div>
   ${(j.assemblies||[]).length?`<div class="prog"><div style="width:${Math.round(asmDone(j)/j.assemblies.length*100)}%"></div></div>`:""}
   ${(j.assemblies||[]).length?`<div class="atw"><table class="at"><thead><tr><th>Assembly</th><th>Who</th>${Object.entries(AST).map(([k,v])=>`<th class="sc" style="--c:${v.c}">${v.t}</th>`).join("")}<th></th></tr></thead><tbody>
   ${j.assemblies.map((a,k)=>{const keys=Object.keys(AST);const si=keys.indexOf(a.status);const locked=finalLocked(j,a);
     return `<tr><td><div class="an2">${esc(a.name)}</div>${(a.meta||a.final)?`<div class="am2">${esc(a.meta||"")}${a.final?(a.meta?" · ":"")+"Final assembly":""}</div>`:""}</td>
     <td>${asmSel(j,k,a,"who").replace("<select ","<select class=\"who\" ")}</td>
     ${locked?`<td colspan="${keys.length}"><div class="waits">Waits until every other assembly is done</div></td>`:keys.map((key,ki)=>`<td><button type="button" class="sb ${ki<si?"past":ki===si?"now":""}" style="--c:${AST[key].c}" data-sj="${esc(j.id)}" data-si="${k}" data-ss="${key}" aria-label="${esc(a.name)}: ${AST[key].t}" aria-pressed="${ki===si}">${ki===si?"●":""}</button></td>`).join("")}
     <td><button type="button" class="rmb" data-rmasm="${k}" aria-label="Remove ${esc(a.name)}">×</button></td></tr>`;}).join("")}
   </tbody></table></div>`:`<div class="empty" style="text-align:left">Split this job into its assemblies so you can hand them out.</div>`}
   <div id="newAsm"></div>`:""}
   <div class="sec"><span>Suppliers</span><button class="btn sm" type="button" id="addSup">+ Add supplier</button></div>
   ${(j.suppliers||[]).map((x,k)=>{const st=ST[x.status]||ST.sent;return `<div class="supbox" style="--c:${st.c}">
     <div class="top"><div><b>${esc(x.name)}</b>${x.contact?` <span style="color:var(--muted)">· ${esc(x.contact)}</span>`:""}
       <div class="meta">${x.scope?esc(x.scope)+" · ":""}${x.sent?"Sent "+fmt(x.sent):"Not sent yet"}${x.updated?" · last update "+fmt(x.updated):""}</div></div>
       <button class="btn sm danger" type="button" data-del="${k}">Remove</button></div>
     <div class="row" style="margin-top:8px">
       <label>Status<select data-f="status" data-i="${k}">${stOpts(x)}</select></label>
       <label>Quote #<input data-f="quoteNo" data-i="${k}" value="${esc(x.quoteNo||"")}"></label>
       <label>Total<input data-f="total" data-i="${k}" value="${esc(x.total||"")}" placeholder="$"></label>
       <label>Lead time<input data-f="lead" data-i="${k}" value="${esc(x.lead||"")}"></label></div>
     <label style="margin-top:8px">Latest<textarea data-f="note" data-i="${k}">${esc(x.note||"")}</textarea></label></div>`;}).join("")||`<div class="empty" style="text-align:left">No suppliers on this job.</div>`}
   <div id="newSup"></div>
   <div class="sec"><span>Notes</span></div>
   <div class="log">${(j.log||[]).slice().reverse().map(l=>`<div><small>${fmt(l.at)}</small>${esc(l.text)}</div>`).join("")||`<div style="color:var(--dim)">No notes yet.</div>`}</div>

        let x=sup.find(y=>p.id&&y.id===p.id)||sup.find(y=>first(y.name).toLowerCase()===first(p.name).toLowerCase());
        if(!x){ x={id:uid(),name:p.name,contact:"",scope:"",quoteNo:"",total:"",lead:"",note:"",status:"sent",sent:now}; sup.push(x); }
        ["status","quoteNo","lead","total","note"].forEach(k=>{ if(p[k]) x[k]=p[k]; }); x.updated=now;
      }
      await saveJob(jid,j); pushUndo(jid,prev,"Applied: "+(s.summary||"suggestion"));
    }
    if((c.todos||[]).length) await sb.from("gvc_todos").insert(c.todos.map(t=>({text:t.text,job_id:(t.job_id&&jobs.some(x=>x.id===t.job_id))?t.job_id:jid,source:s.source,from_name:s.from_name})));
    await setSugg(id,"accepted"); await loadSide();
  }catch(e){ setAiMsg("Couldn't apply: "+(e.message||e)); }
}
/* ---- texts (phone app) ---- */
let smsBusy=false, smsLast=0;
async function checkTexts(manual){
  if(!Native||smsBusy) return; if(!manual&&Date.now()-smsLast<5*60000) return;
  const contacts=LS.get("gvc_sms_contacts",[]);
  if(!contacts.length){ if(manual) pickContacts(); return; }
  smsBusy=true; smsLast=Date.now();
  try{
    const since=LS.get("gvc_sms_since",Date.now()-2*86400000);
    if(manual) setAiMsg("Reading texts…");
    const r=await Native.smsSince({since,addresses:contacts.map(c=>c.address)});
    const msgs=r.messages||[];
    if(!msgs.length){ if(manual) setAiMsg("No new texts from your picked contacts."); return; }
    const by={}; msgs.forEach(m=>{(by[m.key]=by[m.key]||[]).push(m);});
    const items=Object.values(by).map(list=>{const who=(contacts.find(c=>c.key===list[0].key)||{}).name||list[0].name||list[0].address;
      return {ref:"sms:"+list[list.length-1].id, source:"sms", from:who, at:new Date(list[list.length-1].date).toISOString(),
        text:list.map(m=>`[${new Date(m.date).toLocaleString("en-CA",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}] ${m.sent?"Kyle":who}: ${m.body}`).join("\n")};});
    const ok=await askAI(items);
    if(ok) LS.set("gvc_sms_since",Math.max(...msgs.map(m=>m.date)));
  }catch(e){ setAiMsg("Texts: "+(e.message||e)); }
  finally{ smsBusy=false; }
}
async function pickContacts(){
  openId=null; const D=$("#dlg"); D.innerHTML=`<h2 style="margin:0 0 6px">Text contacts</h2><div class="tnote">Loading recent texts…</div>`; $("#scrim").classList.add("on");
  try{
    const r=await Native.smsSenders(); const picked=LS.get("gvc_sms_contacts",[]); const pk=new Set(picked.map(c=>c.key));
    const list=[...picked.filter(p=>!(r.senders||[]).some(s=>s.key===p.key)),...(r.senders||[])];
    D.innerHTML=`<h2 style="margin:0 0 6px">Text contacts</h2><div class="tnote">Only texts with the people you tick are read and sent to Claude. Everything else stays on your phone.</div>
      <div class="clist">${list.map((c,i)=>`<label><input type="checkbox" data-i="${i}" ${pk.has(c.key)?"checked":""}> ${esc(c.name||c.address)} <span>${esc(c.name?c.address:"")}</span></label>`).join("")||`<div class="tnote">No texts found in the last 60 days.</div>`}</div>
      <div class="row" style="margin-top:12px"><button class="btn primary" type="button" id="cSave">Save</button><button class="btn" type="button" id="cCancel">Cancel</button></div>`;
    $("#cCancel").onclick=closeDlg;
    $("#cSave").onclick=()=>{ const sel=[...D.querySelectorAll("[data-i]")].filter(x=>x.checked).map(x=>list[+x.dataset.i]); LS.set("gvc_sms_contacts",sel.map(c=>({key:c.key,address:c.address,name:c.name}))); closeDlg(); render(); checkTexts(true); };
  }catch(e){ D.innerHTML=`<h2>Text contacts</h2><div class="tnote">Couldn't read texts: ${esc(e.message||e)}. Allow SMS and Contacts permission for GVC Shop.</div><button class="btn" type="button" onclick="closeDlg()">Close</button>`; }
}
/* ---- recording (phone app) ---- */
const recState={on:false,t0:0,timer:null};
const recClock=()=>{const s=Math.floor((Date.now()-recState.t0)/1000);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");};
async function toggleRec(){
  try{
    if(!recState.on){
      await Native.recStart(); recState.on=true; recState.t0=Date.now();
      recState.timer=setInterval(()=>{const b=$("#recBtn"); if(b) b.textContent="■ Stop recording "+recClock();},1000);
      render(); return;
    }
    clearInterval(recState.timer); recState.on=false; render();
    setAiMsg("Saving recording…");
    const r=await Native.recStop();
    const bin=atob(r.base64); const u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
    const path=`rec/${new Date().toISOString().replace(/[:.]/g,"-")}.m4a`;
    const up=await sb.storage.from("gvc-audio").upload(path,new Blob([u8],{type:"audio/mp4"}),{contentType:"audio/mp4"});
    if(up.error) throw new Error("upload: "+up.error.message);
    setAiMsg(`Transcribing ${Math.round(r.ms/60000)||"<1"} min and asking Claude…`);
    const { data, error } = await sb.functions.invoke("gvc-ai",{body:{action:"recording",path,at:new Date(recState.t0).toISOString()}});
    if(error||data?.error){ let m=data?.error||error.message; try{ const b=await error.context.json(); m=b.error||m; }catch(e){} throw new Error(m); }
    setAiMsg(data.added?`Recording done - ${data.added} suggestion${data.added>1?"s":""} below.`:"Recording transcribed - nothing job-related found.");
    await loadSide();
  }catch(e){ recState.on=false; clearInterval(recState.timer); setAiMsg("Recording: "+(e.message||e)); render(); }
}

/* ---- chat ---- */
let chatMsgs=LS.get("gvc_chat",[]), chatBusy=false;
function drawChat(){
  const M=$("#chatM");
  M.innerHTML=(chatMsgs.length?"":`<div class="hint">Ask me about your jobs, suppliers or crew - "what's waiting on Russel?", "what should Cooper do next?", "remind me to call William Monday". On your phone, tap the mic on the keyboard to talk.</div>`)+
    chatMsgs.map(m=>m.role==="act"?`<div class="act">✓ ${esc(m.content)}</div>`:`<div class="b ${m.role==="user"?"u":"a"}">${m.role==="user"?esc(m.content):esc(m.content).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/^#+\s*(.+)$/gm,"<b>$1</b>").replace(/^- /gm,"• ")}</div>`).join("")+(chatBusy?`<div class="b a" style="color:var(--dim)">Thinking…</div>`:"");
  M.scrollTop=M.scrollHeight;
}
async function sendChat(){
  const t=$("#chatIn").value.trim(); if(!t||chatBusy) return;
  $("#chatIn").value=""; chatMsgs.push({role:"user",content:t}); chatBusy=true; drawChat();
  try{
    const hist=chatMsgs.filter(m=>m.role!=="act").slice(-20);
    const { data, error } = await sb.functions.invoke("gvc-ai",{body:{action:"chat",messages:hist}});
    if(error||data?.error){ let m=data?.error||error.message; try{ const b=await error.context.json(); m=b.error||m; }catch(e){} throw new Error(m); }
    (data.actions||[]).forEach(a=>chatMsgs.push({role:"act",content:a}));
    chatMsgs.push({role:"assistant",content:data.reply||"Done."});
    if((data.actions||[]).length) loadSide();
  }catch(e){ chatMsgs.push({role:"assistant",content:"Sorry - something went wrong: "+(e.message||e)}); }
  chatBusy=false; chatMsgs=chatMsgs.slice(-40); LS.set("gvc_chat",chatMsgs); drawChat();
}
$("#chatFab").onclick=()=>{ $("#chatP").classList.add("on"); $("#chatFab").hidden=true; drawChat(); setTimeout(()=>$("#chatIn").focus(),50); };
$("#chatX").onclick=()=>{ $("#chatP").classList.remove("on"); $("#chatFab").hidden=false; };
$("#chatClear").onclick=()=>{ chatMsgs=[]; LS.set("gvc_chat",[]); drawChat(); };
$("#chatGo").onclick=sendChat;
$("#chatIn").onkeydown=e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); sendChat(); } };

const HOME_URL="https://jackslinger6.github.io/gvc-shop/";
$("#lForgot").onclick=async()=>{
  const email=$("#lEmail").value.trim();
  if(!email){ showLogin("Type your email above first, then tap Forgot password.", true); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: HOME_URL });
  if(error){ showLogin(error.message, true); return; }
  showLogin("Reset link sent to "+email+". Open it (on this computer is easiest) and pick a new password.");
};
let recovering=false;
sb.auth.onAuthStateChange((ev)=>{ if(ev==="PASSWORD_RECOVERY"){ recovering=true; showLogin("Pick a new password (8+ characters)."); $("#lNew").hidden=false; } });
$("#lSetPass").onclick=async()=>{
  const password=$("#lNewPass").value;
  if(password.length<8){ showLogin("Use at least 8 characters.", true); return; }
  const { error } = await sb.auth.updateUser({ password });
  if(error){ showLogin(error.message, true); return; }
  recovering=false; $("#lNew").hidden=true; history.replaceState(null,"",location.pathname); await startApp();
};
$("#signOut").onclick=async()=>{ try{ Widget && await Widget.signOut(); }catch(e){} await sb.auth.signOut(); jobs=[]; db=null; showLogin("Signed out."); };
if(Widget){ Widget.addListener("launch", d=>{ if(d&&d.tab&&VIEWS.includes(d.tab)){ cur=d.tab; render(); } if(d&&d.job){ setTimeout(()=>{ if(jobs.some(x=>x.id===d.job)) openJob(d.job); },400); } }); }
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && db){ loadJobs(); loadSide(); checkTexts(false); } });
render();
(async()=>{
  let done=false;
  setTimeout(()=>{ if(!done) showLogin("Still connecting… if this stays, check your signal and sign in again."); }, 7000);
  try{
    const { data } = await sb.auth.getSession();
    done=true;
    if(recovering || /type=recovery/.test(START_HASH)){ recovering=true; showLogin("Pick a new password (8+ characters)."); $("#lNew").hidden=false; return; }
    if(data && data.session) await startApp(); else showLogin();
  }catch(e){ done=true; showLogin("Couldn't start: "+(e.message||e), true); }
})();
</script>
