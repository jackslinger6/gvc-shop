name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install and copy the web app into Android
        run: |
          npm ci
          npm run vendor
          npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk gvc-shop.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gvc-shop-apk
          path: gvc-shop.apk

      - name: Publish as the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GVC Shop build ${{ github.run_number }}
          body: "Install on your phone: tap gvc-shop.apk below. Always-current link: https://github.com/${{ github.repository }}/releases/latest/download/gvc-shop.apk"
          files: gvc-shop.apk
          make_latest: true
